# 開発用の Docker Compose 設定
# 使い方: docker compose up  → http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # ソースコードを変更したら即反映されるようホストのコードをマウント
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      # database.yml がこの値を読んで db コンテナに接続する
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pg_data:
